<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share | EmoColor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">

    <style>
        .share-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px 70px;
            color: #333;
        }

        .share-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .share-heading h2 {
            font-size: clamp(28px, 5vw, 42px);
            margin-bottom: 10px;
        }

        .share-form {
            max-width: 560px;
            margin: 0 auto 40px;
            padding: 24px;
            background: #fff7f7;
            border-radius: 20px;
            box-sizing: border-box;
        }

        .share-form label {
            display: block;
            margin: 16px 0 8px;
            font-weight: bold;
        }

        .share-form input,
        .share-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font: inherit;
            background: white;
        }

        .share-form textarea {
            resize: vertical;
            min-height: 80px;
        }

        .share-form button,
        .carousel-button,
        .delete-button {
            border: none;
            border-radius: 999px;
            padding: 10px 20px;
            cursor: pointer;
            font: inherit;
        }

        .share-form button {
            width: 100%;
            margin-top: 20px;
            background: #ffb8c6;
            color: #333;
            font-weight: bold;
        }

        .share-form button:hover {
            background: #ffa4b7;
        }

        .share-message {
            text-align: center;
            min-height: 24px;
            font-size: 14px;
        }

        .gallery-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 20px;
        }

        .carousel-button {
            background: #dcecff;
            font-size: 20px;
        }

        .gallery-window {
            overflow: hidden;
            width: 100%;
        }

        .gallery-track {
            display: flex;
            gap: 18px;
            transition: transform 0.35s ease;
            align-items: stretch;
        }

        .work-card {
            flex: 0 0 calc((100% - 36px) / 3);
            min-width: 0;
            overflow: hidden;
            border-radius: 18px;
            background: #fff7f7;
            box-sizing: border-box;
        }

        .work-card img {
            display: block;
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f3eeee;
        }

        .work-card-content {
            padding: 16px;
            overflow-wrap: anywhere;
        }

        .work-card h3 {
            margin: 0 0 8px;
        }

        .work-card p {
            margin: 0 0 14px;
            white-space: pre-wrap;
        }

        .delete-button {
            background: #eee;
            font-size: 13px;
        }

        .empty-message {
            text-align: center;
            padding: 30px 10px;
            color: #777;
        }

        @media (max-width: 700px) {
            .work-card {
                flex-basis: 85%;
            }

            .work-card img {
                height: 220px;
            }

            .share-page {
                padding: 28px 14px 50px;
            }

            .share-form {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 class="logo">EmoColor</h1>

        <button
            class="hamburger"
            id="hamburger"
            type="button"
            aria-label="メニューを開く"
            aria-expanded="false"
            aria-controls="nav"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="emotion.html">Emotion</a></li>
                <li><a href="paint.html">Paint</a></li>
                <li><a href="share.html">Share</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main class="share-page">
        <section class="share-heading">
    <h2>Share Your Colors</h2>
    <p>あなたの感じた色、あなたの作品をシェアしよう。</p>

    <button
        type="button"
        class="open-share-form"
        id="openShareForm"
    >
        + 作品を投稿する
    </button>
</section>
    </main>

    <script src="menu.js"></script>
    <script src="share.js"></script>
</body>
</html>
