<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <title>お絵描き</title>

    <!-- 既存のCSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap"
        rel="stylesheet">


    <!-- お絵描き専用CSS -->
    <style>

        /* =================================
           お絵描きページ全体
        ================================= */

        .ink-page {
            width: 100%;

            min-height: calc(100vh - 100px);

            display: flex;

            justify-content: center;

            padding: 40px 15px 60px;
        }


        /* =================================
           お絵描きコンテンツ
        ================================= */

        .ink-container {
            width: min(1100px, 100%);

            text-align: center;
        }


        /* =================================
           タイトル
        ================================= */

        .ink-title {
            margin: 0;

            font-size: clamp(28px, 5vw, 48px);

            letter-spacing: 0.15em;

            font-weight: 700;
        }


        .ink-subtitle {
            margin: 8px 0 25px;

            color: #777;

            font-size: 13px;

            letter-spacing: 0.15em;
        }


        /* =================================
           キャンバスを囲む白い紙
        ================================= */

        .ink-paper {
            background: white;

            padding: 15px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.12);

            display: inline-block;

            width: 100%;

            max-width: 1000px;
        }


        /* =================================
           キャンバス
        ================================= */

        #canvas {
            display: block;

            width: 100%;

            height: auto;

            background: white;

            cursor: crosshair;

            touch-action: none;
        }

        /* =========================
   　　　　　　アニメーション用キャンバス
　　　　　　　========================= */

          .canvas-wrap {
              position: relative;
              width: 100%;
          }

          #effectCanvas {
              position: absolute;
              top: 0;
              left: 0;

              width: 100%;
              height: 100%;

              pointer-events: none;
              background: transparent;

              z-index: 2;
          }


        /* =================================
           作品タイトル
        ================================= */

        .ink-work-title {
            margin-top: 20px;
        }


        #titleInput {
            width: min(400px, 90%);

            padding: 12px 15px;

            border: none;

            background: white;

            outline: none;

            font-size: 14px;

            text-align: center;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.06);
        }


        #titleInput:focus {
            box-shadow:
                0 0 0 2px #222;
        }


        /* =================================
           操作パネル
        ================================= */

        .ink-controls {
            width: 100%;

            max-width: 1000px;

            margin: 20px auto 0;

            background: white;

            padding: 20px;

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            align-items: center;

            gap: 15px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }


        .ink-control {
            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 14px;
        }


        /* =================================
           カラーピッカー
        ================================= */

        #colorPicker {
            width: 50px;

            height: 40px;

            padding: 0;

            border: none;

            background: transparent;

            cursor: pointer;
        }


        /* =================================
           サイズ
        ================================= */

        #sizeSlider {
            width: 140px;

            cursor: pointer;
        }


        #sizeValue {
            min-width: 35px;

            text-align: left;

            font-size: 13px;

            color: #666;
        }


        /* =================================
           ボタン
        ================================= */

        .ink-controls button {
            border: none;

            padding: 11px 18px;

            background: #222;

            color: white;

            font-size: 13px;

            cursor: pointer;

            transition: 0.2s;
        }


        .ink-controls button:hover {
            background: #555;

            transform: translateY(-1px);
        }


        .ink-controls button:active {
            transform: translateY(0);
        }


        /* 消しゴム */

        #eraseButton {
            background: #888;
        }


        #eraseButton.active {
            background: #d9534f;
        }


        /* 全消去 */

        #clearButton {
            background: #333;
        }


        /* 保存 */

        #saveButton {
            background: #111;
        }


        /* =================================
           説明
        ================================= */

        .ink-instruction {
            margin-top: 18px;

            color: #777;

            font-size: 12px;

            line-height: 1.8;
        }


        /* =================================
           カウント
        ================================= */

        .ink-counter {
            margin-top: 10px;

            font-size: 11px;

            color: #999;

            letter-spacing: 0.1em;
        }


        /* =================================
           スマートフォン
        ================================= */

        @media (max-width: 600px) {

            .ink-page {
                padding: 25px 10px 40px;
            }


            .ink-paper {
                padding: 8px;
            }


            .ink-controls {
                padding: 15px 10px;

                gap: 10px;
            }


            .ink-control {
                font-size: 12px;
            }


            .ink-controls button {
                padding: 10px 13px;

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         既存のヘッダー
    ================================= -->

    <header>

        <h1 class="logo">
            EmoColor
        </h1>

         <button
    class="hamburger"
    id="hamburger"
    type="button"
    aria-label="メニューを開く"
    aria-expanded="false"
    aria-controls="nav"
>
    <span></span>
    <span></span>
    <span></span>
</button>

        <nav id="nav">

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="emotion.html">
                        Emotion
                    </a>
                </li>

                <li>
                    <a href="paint.html">
                        Paint
                    </a>
                </li>

               <li>
                    <a href="share.html">
                         Share
                    </a>
               </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>
            </ul>

        </nav>

    </header>



    <!-- =================================
         お絵描きページ
    ================================= -->

    <main class="ink-page">

        <div class="ink-container">


            <!-- タイトル -->

            <h2 class="ink-title">
                キャンバス
            </h2>



            <!-- =================================
                 キャンバス
            ================================= -->

            <div class="ink-paper">

    <div class="canvas-wrap">

        <!-- 作品を描くキャンバス -->
        <canvas
            id="canvas"
            width="1200"
            height="750">
        </canvas>

        <!-- 飛んでくるインクを表示するキャンバス -->
        <canvas
            id="effectCanvas"
            width="1200"
            height="750"
            aria-hidden="true">
        </canvas>

    </div>

</div>


<script src="menu.js"></script>
</body>

</html>
